<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wayfinder browser fixture</title>
  </head>
  <body>
    <main>
      <h1>Wayfinder browser fixture</h1>
      <form id="fixture-form">
        <label for="fixture-name">Synthetic name</label>
        <input id="fixture-name" name="name" autocomplete="off" />
        <button type="submit">Create local report</button>
      </form>
      <output id="fixture-status" role="status">Waiting</output>
    </main>
    <script>
      document.querySelector("#fixture-form").addEventListener("submit", (event) => {
        event.preventDefault();
        const data = new FormData(event.currentTarget);
        document.querySelector("#fixture-status").textContent =
          `Local report ready for ${String(data.get("name"))}`;
        history.replaceState(null, "", "/done");
      });
    </script>
  </body>
</html>
